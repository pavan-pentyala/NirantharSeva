server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. A bare `proxy_pass http://api:8000` resolves
    # "api" once, at config-load time, and refuses to start nginx at all if
    # it can't — a real startup-ordering failure this session hit directly
    # (docker-compose.prod.yml's api service took a few seconds longer to
    # come up than client on one run, and nginx crash-looped instead of
    # waiting). Putting the upstream in a variable defers resolution to
    # request time and re-resolves periodically instead of failing once.
    resolver 127.0.0.11 valid=10s;

    # Same relative-path proxy vite.config.ts's dev/preview servers do
    # (see apiProxy there) — the built bundle's own client/src/api/client.ts
    # calls a bare "/api" prefix, never an absolute origin, so this reverse
    # proxy is what makes the static bundle and the API share one origin in
    # production too. That also means CORS_ORIGINS (app/config.py) is
    # defense-in-depth here, not what makes the app itself work — a client
    # hitting the api service directly, bypassing this proxy, is the case
    # it actually gates.
    location /api/ {
        # A variable in proxy_pass disables nginx's automatic prefix
        # stripping (found by testing this, not by inspection — the first
        # version 404'd because /api/health reached the upstream as
        # literally /api/health, not /health) — rewrite has to do it
        # explicitly instead. set has to come BEFORE rewrite ... break —
        # break halts the rest of the rewrite module's directives for this
        # request, set included, if it runs first (also found by testing:
        # the reversed order 500'd with "uninitialized upstream_api").
        set $upstream_api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ADR-018's own warning: a proxy that buffers or times out a long-lived
    # response breaks the live dashboard in the specific way that's hardest
    # to notice until someone is watching it fail. This is that proxy —
    # unbuffered, no cache, no read timeout, matching what SSE needs.
    location /api/dashboard/stream {
        set $upstream_api http://api:8000;
        proxy_pass $upstream_api/dashboard/stream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # SPA fallback — every client-side route (client/src/App.tsx) has to
    # resolve to index.html, or a direct navigation/reload to e.g.
    # /supervisor 404s at the web server instead of reaching react-router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
