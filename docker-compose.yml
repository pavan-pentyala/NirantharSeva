services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-nirantharseva}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

  api:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      CLOCK_MODE: ${CLOCK_MODE:-real}
      SIM_START: ${SIM_START:-}
      RUN_ID: ${RUN_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      IDENTITY_AUTO_ACCEPT: ${IDENTITY_AUTO_ACCEPT:-92.0}
      IDENTITY_REVIEW_FLOOR: ${IDENTITY_REVIEW_FLOOR:-80.0}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
      - ./generator:/app/generator
      - ./experiments:/app/experiments
      - ./configs:/app/configs
      - ./data:/app/data
      - server_venv:/app/.venv
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  scheduler:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Never used by the scheduler itself — required only because
      # app/config.py's single shared Settings model has no default for it
      # (P9.2, ADR-018), and any process constructing Settings() needs a
      # value present, whether or not that process reads the field.
      JWT_SECRET: ${JWT_SECRET}
      CLOCK_MODE: ${CLOCK_MODE:-real}
      SIM_START: ${SIM_START:-}
      RUN_ID: ${RUN_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SLA_SCALE: ${SLA_SCALE:-1.0}
      SWEEP_INTERVAL_SECONDS: ${SWEEP_INTERVAL_SECONDS:-300}
    volumes:
      - ./server:/app
      - server_venv:/app/.venv
    command: python -m app.scheduler.run

  # E5 (Phase 8, P8.3). Not started by plain `docker compose up` — gated
  # behind the "load" profile, since a load test is never something that
  # should run just because the stack came up. Invoke as:
  #   docker compose --profile load run --rm k6 run /scripts/load.js
  k6:
    image: grafana/k6:latest
    profiles: ["load"]
    volumes:
      - ./experiments/k6:/scripts
      - ./server/results/e5:/results
    environment:
      BASE_URL: http://api:8000

  # P9.2 (D44) — the advisory-lock write-latency measurement. A separate
  # service, not a reuse of `k6` above, so P8.3's own already-verified
  # e5/ mount is never touched by this phase (docs/PHASE9_PLAN.md's own
  # "do not re-run any Phase 8 experiment"). Same "load" profile gate.
  #   docker compose --profile load run --rm k6-lock run /scripts/lock.js
  k6-lock:
    image: grafana/k6:latest
    profiles: ["load"]
    volumes:
      - ./experiments/k6:/scripts
      - ./server/results/e5_lock:/results
    environment:
      BASE_URL: http://lock-test-api:8000

  client:
    build: ./client
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_SYNC_INTERVAL_MS: ${VITE_SYNC_INTERVAL_MS:-15000}
    ports:
      - "5173:5173"
      - "4173:4173"  # vite preview — real PWA precache, see pwa-offline-reload.spec.ts
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules

# server_venv and client_node_modules exist so the bind-mounted source dirs
# (needed for live reload) don't shadow the dependencies baked into each
# image. They are named, not anonymous, so a stale copy is visible via
# `docker volume ls` — but they still only get refreshed from a rebuilt
# image with `docker compose up --build -V <service>` (the -V flag renews
# named/anonymous volumes; without it Compose reuses the existing one even
# after --build, which silently keeps old dependencies).
volumes:
  pgdata: {}
  server_venv: {}
  client_node_modules: {}
