name: CI

on:
  push:
  pull_request:

jobs:
  clock-discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No direct clock calls outside app/clock.py (ADR-001)
        run: |
          if grep -rnE 'datetime\.(now|utcnow)\(|time\.time\(' server/app \
              --include='*.py' | grep -v 'server/app/clock.py'; then
            echo "::error::Found a direct clock call outside app/clock.py. Use the injected Clock — see docs/decisions/ADR-001.md."
            exit 1
          fi
      - name: No direct clock calls in generator/, server/scripts, or experiments/ (docs/PHASE7_PLAN.md, docs/PHASE8_PLAN.md)
        run: |
          if grep -rnE 'datetime\.(now|utcnow)\(|time\.time\(' generator server/scripts experiments \
              --include='*.py'; then
            echo "::error::Found a direct clock call in generator/, server/scripts, or experiments/ — device times and experiment time must come from the config's simulated start / the injected SimulatedClock, see docs/PHASE7_PLAN.md and docs/PHASE8_PLAN.md. Wall-clock harness timing must use time.monotonic(), never datetime.now()/time.time()."
            exit 1
          fi

  server:
    runs-on: ubuntu-latest
    needs: clock-discipline
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: nirantharseva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:dev@localhost:5432/nirantharseva_test
      JWT_SECRET: ci-test-secret
      CLOCK_MODE: real
      RUN_ID: ci
      LOG_LEVEL: INFO
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run python -m app.seed
      - run: uv run pytest
      - run: uv run python -m app.verify_replay

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # Fault tests from plan §5.6 — these become E4. Needs the real stack (real
  # IndexedDB via a real browser, real Postgres, real network toggling), not
  # something a unit/integration test can substitute for. Runs docker compose
  # directly rather than uv/npm on the runner, so the environment matches
  # local dev exactly and kill_api.sh (which itself calls `docker compose
  # kill`) can run unmodified.
  e2e:
    runs-on: ubuntu-latest
    needs: [server, client]
    # Safeguard, not a tuning knob: a normal run finishes in a few minutes.
    # Bounds a hung step (the playwright install step below explains one
    # known cause) to a clear failure instead of a silent multi-hour stall.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # npm ci and the Playwright browser install run BEFORE `docker compose
      # up`, not after. The client service bind-mounts ./client:/app and
      # mounts the named volume client_node_modules at /app/node_modules —
      # since that path sits inside a host bind mount, Docker has to create
      # client/node_modules on the actual host filesystem as the mount
      # point if it doesn't exist yet, and it does that as the (root) Docker
      # daemon. On a clean runner nothing exists yet, so `docker compose up`
      # first leaves client/node_modules root-owned, and a later `npm ci`
      # (running as the unprivileged runner user) fails with EACCES trying
      # to write into it. Installing first means npm creates the directory
      # with the right ownership, and Docker just reuses it as-is.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - working-directory: client
        run: npm ci
      # --with-deps runs apt-get under the hood. Recent Ubuntu runner images
      # ship needrestart, which can pop an interactive "restart services?"
      # prompt during that apt-get — with no TTY attached, apt just blocks
      # forever waiting for a keypress that never comes, and the step hangs
      # with no error output rather than failing. Both env vars force
      # non-interactive apt.
      - working-directory: client
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: npx playwright install --with-deps chromium
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - name: Wait for API health
        run: |
          for _ in $(seq 1 60); do
            if curl -s -o /dev/null -w '%{http_code}' localhost:8000/health | grep -q 200; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::API never became healthy"
          docker compose logs
          exit 1
      - name: Seed the district (kill_api.sh needs asha_a to exist)
        run: docker compose run --rm api python -m app.seed
      # offline-sync.spec.ts runs against the built+previewed app on :4173,
      # not the dev server on :5173 — vite-plugin-pwa's injectManifest
      # strategy only produces a real (non-empty) precache manifest in a
      # production build, and that test's reload-while-offline step is
      # exactly what the precache exists to make possible (P4.3, plan §8.4).
      - name: Build and serve the production bundle (PWA precache)
        run: |
          docker compose exec -T client npm run build
          docker compose exec -d client npm run preview
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null -w '%{http_code}' localhost:4173/ | grep -q 200; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::vite preview never became reachable on :4173"
          docker compose logs client
          exit 1
      - working-directory: client
        run: npx playwright test
      - name: Kill-API fault test (plan §5.6)
        run: bash server/tests/fault/kill_api.sh
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
