name: CI

on:
  push:
  pull_request:

jobs:
  clock-discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No direct clock calls outside app/clock.py (ADR-001)
        run: |
          if grep -rnE 'datetime\.(now|utcnow)\(|time\.time\(' server/app \
              --include='*.py' | grep -v 'server/app/clock.py'; then
            echo "::error::Found a direct clock call outside app/clock.py. Use the injected Clock — see docs/decisions/ADR-001.md."
            exit 1
          fi

  server:
    runs-on: ubuntu-latest
    needs: clock-discipline
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: nirantharseva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:dev@localhost:5432/nirantharseva_test
      JWT_SECRET: ci-test-secret
      CLOCK_MODE: real
      RUN_ID: ci
      LOG_LEVEL: INFO
      DEV_USERS: "asha1:dev:ASHA:1"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
