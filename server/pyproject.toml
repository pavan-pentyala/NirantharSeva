[project]
name = "nirantharseva-server"
version = "0.1.0"
description = "NirantharSeva API, scheduler, and sync core"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "apscheduler>=3.10",
    "rapidfuzz>=3.10",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "hypothesis>=6.115",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# generator/ is a repo-root directory (docs/PHASE6_PLAN.md P6.1 build order
# #9), one level above server/ (this file's own directory, pytest's
# rootdir). Without this, `import generator` outside Docker's bind mount
# resolves to nothing real: this machine had a stray, untracked, empty
# server/generator/ directory (a leftover Docker Desktop bind-mount
# artifact) that Python happily imports as an empty PEP 420 namespace
# package with no error and no submodules, so `from generator.gold_set
# import generate` fails with ModuleNotFoundError('generator.gold_set')
# instead of the fixable ModuleNotFoundError('generator') a fresh checkout
# would raise. Found while adding P7.1's generator-importing unit tests;
# every generator-importing test (including P6.1's own
# tests/unit/test_gold_set.py) was silently untested outside `docker
# compose run` before this line existed — see docs/OBSERVATIONS.md
# Phase 7 section.
pythonpath = [".."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Without this, ruff's import-sort category for `generator` depends on
# whether it is physically nested under this file's directory — true only
# inside Docker's bind mount (docker-compose.yml mounts ./generator at
# /app/generator, alongside ./server's own /app/app), false on a bare
# checkout (CI's "server" job, and any local `uv run ruff` from server/),
# where generator/ is a sibling directory instead. The two environments
# disagreed about where `from generator... import ...` belongs relative to
# `from app... import ...` until this was pinned explicitly. Found while
# adding P7.1's generator-importing tests.
known-first-party = ["app", "generator"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]
